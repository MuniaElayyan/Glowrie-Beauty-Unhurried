<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glowrie — Beauty, Unhurried</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Glowrie is a fan-made concept store built to show off pretty makeup design work. Not a real shop." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
   
    <style>
      html { scroll-behavior: smooth; }
      body { background: #FFF8F4; overflow-x: hidden; }
      ::selection { background: #F3C0D6; color: #341F30; }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
      }

      /* خلفية الهيرو المتحركة (أعمدة المنتجات) */
      @keyframes strip-scroll-up {
        from { transform: translateY(0); }
        to { transform: translateY(-50%); }
      }
      @keyframes strip-scroll-down {
        from { transform: translateY(-50%); }
        to { transform: translateY(0); }
      }
      .strip-track {
        display: flex;
        flex-direction: column;
        height: 200%;
        width: 100%;
        will-change: transform;
        animation-duration: 14s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .strip-up { animation-name: strip-scroll-up; }
      .strip-down { animation-name: strip-scroll-down; }
      .strip-track img.strip-img {
        display: block;
        height: 50%;
        width: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body class="bg-blush-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
